const sheet=document.querySelector('#sheet'),dlg=document.querySelector('#dlg');
function show(html){sheet.innerHTML=html;if(!dlg.open)dlg.showModal();dlg.scrollTop=0}
function rows(pairs){return '<div class="rows">'+pairs.map(([k,v])=>'<div class="row"><strong>'+k+'</strong><div>'+v+'</div></div>').join('')+'</div>'}
document.querySelector('.close').onclick=()=>dlg.close();
function detail(i){const m=items[i];show('<small>材料資料</small><h2>'+m.name+'</h2><img alt="包裝示意" src="'+m.img+'">'+rows([['料源地區',m.place],['材料型態',m.type],['目前進度',m.status],['處理方向',m.detail]])+'<button class="cta" id="inquire">洽詢這項材料</button>');document.querySelector('#inquire').onclick=()=>form(m.name)}
items.forEach((m,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<img alt="'+m.name+'包裝示意" src="'+m.img+'"><div><small>'+m.place+'</small><h3>'+m.name+' <span>↗</span></h3>'+m.status+'</div>';b.onclick=()=>detail(i);document.querySelector('#cards').append(b)});
document.querySelector('#passport').onclick=()=>{show('<small>MATERIAL PASSPORT</small><h2>竹粉批次護照示範</h2>'+rows([['需求規格','2000 目，50 公斤'],['交付狀態','試單需求已確認，尚未交付'],['批次編號','交付批次尚待建立'],['來源與加工','待批次建檔'],['粒徑與含水率','待確認驗收方式與實測結果'],['包裝','袋材、袋重與密封方式待確認']])+'<button id="powder" class="cta">洽詢竹粉規格</button>');document.querySelector('#powder').onclick=()=>form('竹粉')};
let records=[];try{records=JSON.parse(localStorage.getItem('hoyaoAtlasRequests')||'[]')}catch{}
function form(name=''){show('<small>CUSTOM SOURCING</small><h2>提出找料需求</h2><p class="note">設計預覽用。工單只保存在此瀏覽器。</p><form><label>材料名稱<input name="material" required></label><label>用途與規格<textarea name="spec" required placeholder="例如：複材試作，需確認粒徑分布與含水率"></textarea></label><label>需求數量<input name="qty" required placeholder="例如：試樣 5 公斤"></label><label>預計交期（選填）<input name="due" type="date"></label><button class="cta">建立示範工單</button></form>');let f=sheet.querySelector('form');f.material.value=name;f.onsubmit=e=>{e.preventDefault();let rec=Object.fromEntries(new FormData(f));rec.id='HY-'+Date.now().toString(36).toUpperCase();records.unshift(rec);let msg='已建立示範工單';try{localStorage.setItem('hoyaoAtlasRequests',JSON.stringify(records))}catch{msg+='（僅本次開啟可查看）'}tracking(msg)}}
function tracking(title='我的工單'){show('<small>REQUEST TRACKING</small><h2>'+title+'</h2>');if(!records.length){sheet.insertAdjacentHTML('beforeend','<p>此瀏覽器尚無示範工單。</p><button class="cta" id="first">提出找料需求</button>');document.querySelector('#first').onclick=()=>form();return}records.forEach(r=>{let box=document.createElement('div');box.className='record';let a=document.createElement('strong');a.textContent=r.material+' · '+r.qty;box.append(a);[r.id+' ｜ 需求已記錄',r.spec,r.due?'預計交期 '+r.due:''].filter(Boolean).forEach(t=>{let d=document.createElement('div');d.textContent=t;box.append(d)});sheet.append(box)});sheet.insertAdjacentHTML('beforeend','<p class="note">預覽流程：需求記錄 → 規格確認 → 加工／備樣 → 寄樣／交付。正式服務啟用後由承辦人更新進度。</p>')}
document.querySelector('#ask').onclick=()=>form();document.querySelector('#track').onclick=()=>tracking();
</script></html>
